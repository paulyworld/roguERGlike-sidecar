[project]
name = "roguerglike-sidecar"
version = "0.1.0"
description = "BLE bridge and telemetry pipeline for smart trainers and HR sensors"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Paul" }]
dependencies = [
    "bleak>=0.22.0",
    "websockets>=12.0",
    "pydantic>=2.0",
    "click>=8.1",
    "fit-tool>=0.9.13",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
roguerglike-sidecar = "roguerglike_sidecar.cli:main"
roguerglike-export = "roguerglike_sidecar.export.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["roguerglike_sidecar"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

# fit-tool ships without type stubs / py.typed marker. Treat its
# imports as untyped rather than failing the type check; the wrapper
# in `roguerglike_sidecar.export.fit` is the typed seam.
[[tool.mypy.overrides]]
module = ["fit_tool.*"]
ignore_missing_imports = true
